<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes scanMotion {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { transform: translateY(140px); opacity: 0.9; }
        100% { transform: translateY(0px); opacity: 0.2; }
      }
      @keyframes pulseNode {
        0%, 100% { r: 4; opacity: 0.4; filter: drop-shadow(0 0 2px #06b6d4); }
        50% { r: 7; opacity: 1; filter: drop-shadow(0 0 8px #8b5cf6); }
      }
      @keyframes floatDoc {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .scanner-beam {
        animation: scanMotion 4s ease-in-out infinite;
      }
      .node-1 { animation: pulseNode 2.5s ease-in-out infinite; }
      .node-2 { animation: pulseNode 3.1s ease-in-out infinite 0.8s; }
      .node-3 { animation: pulseNode 2.8s ease-in-out infinite 1.4s; }
      .doc-card { animation: floatDoc 6s ease-in-out infinite; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
    <line x1="1100" y1="0" x2="1100" y2="420"/>
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="100" r="120" fill="#6366f1" opacity="0.12" filter="url(#cardGlow)"/>
  <circle cx="1050" cy="300" r="140" fill="#ec4899" opacity="0.1" filter="url(#cardGlow)"/>
  <circle cx="850" cy="120" r="100" fill="#06b6d4" opacity="0.12" filter="url(#cardGlow)"/>

  <!-- Left Content Column -->
  <g transform="translate(70, 70)">
    <!-- Badge -->
    <rect width="210" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="16" cy="16" r="5" fill="#10b981"/>
    <text x="32" y="21" fill="#c7d2fe" font-size="13" font-weight="600" class="mono-text">AI DOCUMENT INTELLIGENCE</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-size="44" class="title-text" letter-spacing="-0.5">
      Awesome <tspan fill="url(#accentGrad)">Invoice OCR</tspan>
    </text>
    <text x="0" y="130" fill="#ffffff" font-size="40" class="title-text" letter-spacing="-0.5">
      Platform Ecosystem
    </text>

    <!-- Subtitle / Description -->
    <text x="0" y="175" fill="#94a3b8" font-size="17" class="body-text" font-weight="400">
      Curated Landscape of Commercial SaaS &amp; Open-Source Deep Learning Engines
    </text>
    <text x="0" y="202" fill="#64748b" font-size="15" class="body-text">
      Field Extraction • Line-Item Parsing • Table Recognition • LayoutLM • AP Workflows
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 235)">
      <rect width="130" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#38bdf8" font-size="12" font-weight="600" class="mono-text">⚡ 10+ SaaS APIs</text>

      <rect x="142" width="160" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="154" y="20" fill="#a855f7" font-size="12" font-weight="600" class="mono-text">⭐ 14+ Open Source</text>

      <rect x="314" width="165" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="326" y="20" fill="#34d399" font-size="12" font-weight="600" class="mono-text">📊 Pricing &amp; Benchmarks</text>
    </g>
  </g>

  <!-- Right Visual: Interactive Document Scanner Mockup -->
  <g class="doc-card" transform="translate(770, 50)">
    <!-- Document Container Shadow & Background -->
    <rect width="360" height="310" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#glow)" opacity="0.95"/>
    <rect width="360" height="310" rx="14" fill="#1e293b" fill-opacity="0.8"/>
    
    <!-- Top Document Header Bar -->
    <path d="M 0 14 Q 0 0 14 0 L 346 0 Q 360 0 360 14 L 360 42 L 0 42 Z" fill="#0f172a"/>
    <circle cx="22" cy="21" r="5" fill="#ef4444"/>
    <circle cx="38" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="54" cy="21" r="5" fill="#10b981"/>
    <text x="80" y="26" fill="#64748b" font-size="12" class="mono-text">invoice_parser_v3.json</text>
    <rect x="275" y="10" width="70" height="22" rx="4" fill="#065f46"/>
    <text x="284" y="25" fill="#34d399" font-size="11" font-weight="700" class="mono-text">99.4% ACC</text>

    <!-- Document Content & Bounding Boxes -->
    <g transform="translate(25, 60)">
      <!-- Invoice Header simulation -->
      <rect width="90" height="14" rx="3" fill="#38bdf8" fill-opacity="0.8"/>
      <rect x="220" y="0" width="85" height="12" rx="2" fill="#475569"/>
      <rect x="240" y="18" width="65" height="8" rx="2" fill="#334155"/>

      <!-- OCR Bounding Box 1: Vendor -->
      <rect x="0" y="32" width="130" height="26" rx="4" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="3 2"/>
      <text x="8" y="49" fill="#c7d2fe" font-size="11" class="mono-text">Vendor: ACME Global</text>

      <!-- OCR Bounding Box 2: Total Amount -->
      <rect x="175" y="32" width="130" height="26" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2"/>
      <text x="183" y="49" fill="#6ee7b7" font-size="11" class="mono-text">Total: $42,850.00</text>

      <!-- Table Header -->
      <line x1="0" y1="75" x2="310" y2="75" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="85" width="60" height="8" rx="2" fill="#64748b"/>
      <rect x="110" y="85" width="40" height="8" rx="2" fill="#64748b"/>
      <rect x="190" y="85" width="30" height="8" rx="2" fill="#64748b"/>
      <rect x="260" y="85" width="45" height="8" rx="2" fill="#64748b"/>

      <!-- Table Rows (Parsed Items) -->
      <g transform="translate(0, 105)">
        <rect x="0" y="0" width="310" height="22" rx="3" fill="#1e1b4b" fill-opacity="0.5"/>
        <text x="6" y="15" fill="#e2e8f0" font-size="10" class="mono-text">Cloud GPU Node A100</text>
        <text x="195" y="15" fill="#94a3b8" font-size="10" class="mono-text">4x</text>
        <text x="250" y="15" fill="#38bdf8" font-size="10" class="mono-text">$12,400</text>

        <rect x="0" y="28" width="310" height="22" rx="3" fill="#0f172a" fill-opacity="0.6"/>
        <text x="6" y="43" fill="#e2e8f0" font-size="10" class="mono-text">LayoutLM Fine-tuning</text>
        <text x="195" y="43" fill="#94a3b8" font-size="10" class="mono-text">1x</text>
        <text x="250" y="43" fill="#38bdf8" font-size="10" class="mono-text">$4,500</text>
      </g>

      <!-- Extraction Key-Value Visualizer -->
      <g transform="translate(0, 180)">
        <rect width="310" height="38" rx="5" fill="#020617" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
        <text x="10" y="16" fill="#a78bfa" font-size="9" class="mono-text">JSON { "status": "verified", "vat_id": "DE812345",</text>
        <text x="10" y="30" fill="#38bdf8" font-size="9" class="mono-text">       "line_items_count": 8, "confidence": 0.998 }</text>
      </g>

      <!-- Animated Scanning Laser Beam -->
      <g class="scanner-beam" transform="translate(0, 20)">
        <rect x="-10" y="0" width="330" height="12" fill="url(#scanGrad)"/>
        <line x1="-10" y1="6" x2="320" y2="6" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
      </g>

      <!-- Neural Network Nodes -->
      <circle cx="150" cy="45" class="node-1" fill="#06b6d4"/>
      <circle cx="280" cy="115" class="node-2" fill="#8b5cf6"/>
      <circle cx="35" cy="195" class="node-3" fill="#ec4899"/>
    </g>
  </g>
</svg>
